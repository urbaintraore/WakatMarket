# Blueprint Render — WakatMarket API (port des Cloud Functions Firebase).
# Utilisation : Render → "New +" → Blueprint → choisir ce dépôt GitHub.
services:
  - type: web
    name: wakatmarket-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: CRON_SECRET
        sync: false

  # Alertes de réapprovisionnement planifiées (04h00 UTC, Africa/Ouagadougou).
  # NB : les cron jobs Render nécessitent un plan payant ; sinon utilisez un
  # scheduler externe (cron-job.org) qui POSTe sur /api/cron/stock-alerts
  # avec le header x-cron-secret.
  - type: cron
    name: wakatmarket-stock-alerts
    runtime: node
    plan: free
    schedule: "0 4 * * *"
    rootDir: server
    buildCommand: npm install
    startCommand: node src/cronJob.js
    envVars:
      - key: CRON_JOB_URL
        sync: false
      - key: CRON_SECRET
        sync: false